function doSubmit(mode, modeState, questions) {
  const idx = clampIndex(modeState.currentIndex || 0, questions.length);
  const currentQ = questions[idx];
  const ua = getAnswerValue(currentQ, modeState);
  if (ua !== null && ua !== undefined) return;

  const isMulti = currentQ.type === 'multi';
  const ans = isMulti ? _selected.slice().sort().join('') : (_selected[0] || '');
  if (!ans) return;

  modeState.answers[currentQ.key] = ans;
  // ★ 记录统计数据
  recordAnswer(currentQ, isCorrectAnswer(currentQ, ans));
  saveState();
  render();
}

function doReveal(mode, modeState, questions) {
  if (mode === 'exam') return;
  const idx = clampIndex(modeState.currentIndex || 0, questions.length);
  const currentQ = questions[idx];
  const ua = getAnswerValue(currentQ, modeState);
  if (ua !== null && ua !== undefined) return;
  modeState.revealed[currentQ.key] = true;
  saveState();
  render();
}

function navigate(mode, modeState, questions, dir) {
  const idx = clampIndex(modeState.currentIndex || 0, questions.length);
  const newIdx = idx + dir;
  if (newIdx >= 0 && newIdx < questions.length) {
    modeState.currentIndex = newIdx;
    if (modeState.visited && questions[newIdx]) {
      modeState.visited[questions[newIdx].id] = true;
    }
    saveState();
    render();
  }
}

function bindChoiceEvents(mode, modeState, questions) {
  _selected = [];
  const idx = clampIndex(modeState.currentIndex || 0, questions.length);
  const currentQ = questions[idx];
  if (!currentQ) return;
  const answered = isAnswered(modeState, currentQ) || isRevealed(modeState, currentQ);
  const isMulti = currentQ.type === 'multi';

  document.querySelectorAll('.option-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      if (answered) return;
      const letter = btn.dataset.letter;
      if (isMulti) {
        const i = _selected.indexOf(letter);
        if (i >= 0) {
          _selected.splice(i, 1);
          btn.classList.remove('selected');
        } else {
          _selected.push(letter);
          btn.classList.add('selected');
        }
      } else {
        document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
        _selected = [letter];
        btn.classList.add('selected');
      }
    });
  });

  document.getElementById('btnSubmit')?.addEventListener('click', () => doSubmit(mode, modeState, questions));
  document.getElementById('btnPrev')?.addEventListener('click', () => navigate(mode, modeState, questions, -1));
  document.getElementById('btnNext')?.addEventListener('click', () => navigate(mode, modeState, questions, 1));
  document.getElementById('btnReveal')?.addEventListener('click', () => doReveal(mode, modeState, questions));

  document.getElementById('btnResetMode')?.addEventListener('click', () => {
    if (!confirm('重置当前模式的所有答题记录？')) return;
    const fresh = makeDefaultState()[mode];
    state[mode] = fresh;
    saveState();
    render();
  });
  document.getElementById('btnResetAll')?.addEventListener('click', () => {
    if (!confirm('清除全部答题记录？')) return;
    localStorage.removeItem(STORAGE_KEY);
    state = loadState();
    render();
  });

  document.getElementById('btnResetExam')?.addEventListener('click', () => {
    if (!confirm('重置考试答案记录？')) return;
    state.exam.answers = {};
    state.exam.revealed = {};
    state.exam.currentIndex = 0;
    state.exam.visited = {};
    saveState();
    render();
  });
  document.getElementById('btnRegenExam')?.addEventListener('click', () => {
    if (!confirm('重新生成试卷？当前答题记录将丢失。')) return;
    state.exam.questions = genExamQuestions();
    state.exam.answers = {};
    state.exam.revealed = {};
    state.exam.currentIndex = 0;
    state.exam.visited = {};
    state.exam.cardOpen = true;
    saveState();
    render();
  });
  document.getElementById('btnGenExam')?.addEventListener('click', () => {
    state.exam.questions = genExamQuestions();
    state.exam.answers = {};
    state.exam.revealed = {};
    state.exam.currentIndex = 0;
    state.exam.visited = {};
    state.exam.cardOpen = true;
    saveState();
    render();
  });

  document.getElementById('btnResetEssay')?.addEventListener('click', () => {
    if (!confirm('重置浏览记录？')) return;
    state[mode].visited = {};
    state[mode].currentIndex = 0;
    saveState();
    render();
  });

  document.querySelectorAll('[data-jump]').forEach(btn => {
    btn.addEventListener('click', () => {
      const target = parseInt(btn.dataset.jump, 10);
      if (!Number.isNaN(target)) {
        modeState.currentIndex = target;
        if (modeState.visited && questions[target]) {
          modeState.visited[questions[target].id] = true;
        }
        saveState();
        render();
      }
    });
  });

  document.getElementById('orderSeq')?.addEventListener('click', () => {
    state[mode].orderMode = 'seq';
    state[mode].currentIndex = 0;
    saveState();
    render();
  });
  document.getElementById('orderRand')?.addEventListener('click', () => {
    state[mode].orderMode = 'rand';
    // Always re-shuffle from source to ensure true random order each click
    const sourceList = mode === 'single' ? DATA.singleChoice : mode === 'multi' ? DATA.multiChoice : DATA.judgeQuestions;
    state[mode].shuffled = shuffle(sourceList);
    state[mode].currentIndex = 0;
    saveState();
    render();
  });

  updateMobileActionBar(mode, modeState, questions);

  if (!window.IS_MOBILE && !currentQ._isEssay) {
    if (window._kbCleanup) window._kbCleanup();
    const handler = function(e) {
      if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
      if (!answered) {
        const num = parseInt(e.key, 10);
        if (num >= 1 && num <= currentQ.options.length) {
          const opt = currentQ.options[num - 1];
          const btn = document.querySelector('.option-btn[data-letter="' + opt.letter + '"]');
          if (btn) btn.click();
        }
      }
      if (e.key === 'Enter' && !answered) {
        e.preventDefault();
        doSubmit(mode, modeState, questions);
      }
      if (e.key === 'ArrowRight') {
        e.preventDefault();
        navigate(mode, modeState, questions, 1);
      }
      if (e.key === 'ArrowLeft') {
        e.preventDefault();
        navigate(mode, modeState, questions, -1);
      }
      if ((e.key === 'r' || e.key === 'R') && !answered && mode !== 'exam') {
        e.preventDefault();
        doReveal(mode, modeState, questions);
      }
    };
    document.addEventListener('keydown', handler);
    window._kbCleanup = () => document.removeEventListener('keydown', handler);
  }
}

function updateMobileActionBar(mode, modeState, questions) {
  if (!window.IS_MOBILE) return;
  const bar = document.getElementById('mobileActionBar');
  if (!bar) return;

  if (mode === 'jianDa' || mode === 'lunShu') {
    const ei = clampIndex(modeState.currentIndex || 0, questions.length);
    const total = questions.length;
    bar.innerHTML =
      '<button class="btn btn-outline" id="mbPrevEssay"' + (ei === 0 ? ' disabled' : '') + ' style="flex:0 0 auto">← 上题</button>' +
      '<button class="btn btn-primary" id="mbNextEssay"' + (ei >= total - 1 ? ' disabled' : '') + ' style="flex:1;justify-content:center">下一题 →</button>';
    document.getElementById('mbPrevEssay')?.addEventListener('click', () => {
      if (modeState.currentIndex > 0) { modeState.currentIndex--; saveState(); render(); }
    });
    document.getElementById('mbNextEssay')?.addEventListener('click', () => {
      if (modeState.currentIndex < questions.length - 1) { modeState.currentIndex++; saveState(); render(); }
    });
    return;
  }

  if (mode === 'exam') {
    const idx = clampIndex(modeState.currentIndex || 0, questions.length);
    const currentQ = questions[idx];
    if (!currentQ) { bar.innerHTML = ''; return; }
    if (currentQ._isEssay) {
      bar.innerHTML =
        (idx > 0 ? '<button class="btn btn-outline" id="mbPrev" style="flex:0 0 auto">←</button>' : '<span style="flex:0 0 36px"></span>') +
        '<button class="btn btn-primary" id="mbNext" style="flex:1;justify-content:center"' + (idx >= questions.length - 1 ? ' disabled' : '') + '>' + (idx < questions.length - 1 ? '下一题 →' : '已完成 ✓') + '</button>' +
        '<button class="btn btn-ghost" id="mbCard" style="flex:0 0 auto">答题卡</button>';
    } else {
      const answered = isAnswered(modeState, currentQ) || isRevealed(modeState, currentQ);
      bar.innerHTML =
        (idx > 0 ? '<button class="btn btn-outline" id="mbPrev" style="flex:0 0 auto">←</button>' : '<span style="flex:0 0 36px"></span>') +
        (!answered
          ? '<button class="btn btn-primary" id="mbSubmit" style="flex:1;justify-content:center">✔ 提交</button>'
          : '<button class="btn btn-primary" id="mbNext" style="flex:1;justify-content:center"' + (idx >= questions.length - 1 ? ' disabled' : '') + '>' + (idx < questions.length - 1 ? '下一题 →' : '已完成 ✓') + '</button>'
        ) +
        '<button class="btn btn-ghost" id="mbCard" style="flex:0 0 auto">答题卡</button>';
    }
    document.getElementById('mbPrev')?.addEventListener('click', () => navigate(mode, modeState, questions, -1));
    document.getElementById('mbNext')?.addEventListener('click', () => navigate(mode, modeState, questions, 1));
    document.getElementById('mbSubmit')?.addEventListener('click', () => doSubmit(mode, modeState, questions));
    document.getElementById('mbCard')?.addEventListener('click', () => {
      state.exam.cardOpen = !state.exam.cardOpen;
      saveState();
      render();
    });
    return;
  }

  if (!questions || questions.length === 0) {
    bar.innerHTML = '';
    return;
  }

  const idx = clampIndex(modeState.currentIndex || 0, questions.length);
  const currentQ = questions[idx];
  const answered = isAnswered(modeState, currentQ) || isRevealed(modeState, currentQ);

  bar.innerHTML =
    (idx > 0 ? '<button class="btn btn-outline" id="mbPrev" style="flex:0 0 auto">←</button>' : '<span style="flex:0 0 36px"></span>') +
    (!answered
      ? '<button class="btn btn-primary" id="mbSubmit" style="flex:1;justify-content:center">✔ 提交</button>'
      : '<button class="btn btn-primary" id="mbNext" style="flex:1;justify-content:center"' + (idx >= questions.length - 1 ? ' disabled' : '') + '>' + (idx < questions.length - 1 ? '下一题 →' : '已完成 ✓') + '</button>'
    ) +
    (!answered ? '<button class="btn btn-ghost" id="mbReveal" style="flex:0 0 auto">👁</button>' : '');

  document.getElementById('mbPrev')?.addEventListener('click', () => navigate(mode, modeState, questions, -1));
  document.getElementById('mbNext')?.addEventListener('click', () => navigate(mode, modeState, questions, 1));
  document.getElementById('mbSubmit')?.addEventListener('click', () => doSubmit(mode, modeState, questions));
  document.getElementById('mbReveal')?.addEventListener('click', () => doReveal(mode, modeState, questions));
}

function render() {
  const mode = state.currentMode;
  const mainEl = document.getElementById('mainContent');

  document.querySelectorAll('.nav-tab, .mobile-nav-tab').forEach(t => {
    t.classList.toggle('active', t.dataset.mode === mode);
  });

  if (mode === 'jianDa' || mode === 'lunShu') {
    mainEl.innerHTML = renderEssayMode(mode);
    bindEssayEvents(mode);
  } else if (mode === 'mistake') {
    // ★ 错题本模式
    mainEl.innerHTML = renderMistakeBook();
    bindMistakeEvents();
  } else if (mode === 'exam') {
    if (!state.exam.questions) {
      state.exam.questions = genExamQuestions();
    }
    mainEl.innerHTML = renderExamMode();
    bindExamEvents();
  } else {
    const questions = getModeQuestions(mode);
    const modeState = state[mode];
    mainEl.innerHTML = renderPracticeMode(mode, questions, modeState);
    bindChoiceEvents(mode, modeState, questions);
  }
  updateGlobalStats();
}

function bindEssayEvents(mode) {
  const questions = getModeQuestions(mode);
  const modeState = state[mode];
  const ei = clampIndex(modeState.currentIndex || 0, questions.length);
  const total = questions.length;

  document.getElementById('btnPrevEssay')?.addEventListener('click', () => {
    if (modeState.currentIndex > 0) {
      modeState.currentIndex--;
      if (modeState.visited && questions[modeState.currentIndex]) {
        modeState.visited[questions[modeState.currentIndex].id] = true;
      }
      saveState();
      render();
    }
  });
  document.getElementById('btnNextEssay')?.addEventListener('click', () => {
    if (modeState.currentIndex < questions.length - 1) {
      modeState.currentIndex++;
      if (modeState.visited && questions[modeState.currentIndex]) {
        modeState.visited[questions[modeState.currentIndex].id] = true;
      }
      saveState();
      render();
    }
  });

  document.querySelectorAll('[data-jump]')?.forEach(btn => {
    btn.addEventListener('click', () => {
      const target = parseInt(btn.dataset.jump, 10);
      if (!Number.isNaN(target)) {
        modeState.currentIndex = target;
        if (modeState.visited && questions[target]) {
          modeState.visited[questions[target].id] = true;
        }
        saveState();
        render();
      }
    });
  });

  document.getElementById('btnResetEssay')?.addEventListener('click', () => {
    if (!confirm('重置浏览记录？')) return;
    state[mode].visited = {};
    state[mode].currentIndex = 0;
    saveState();
    render();
  });
  document.getElementById('btnResetAll')?.addEventListener('click', () => {
    if (!confirm('清除全部答题记录？')) return;
    localStorage.removeItem(STORAGE_KEY);
    state = loadState();
    render();
  });

  document.getElementById('orderSeq')?.addEventListener('click', () => {
    state[mode].orderMode = 'seq';
    state[mode].currentIndex = 0;
    saveState();
    render();
  });
  document.getElementById('orderRand')?.addEventListener('click', () => {
    state[mode].orderMode = 'rand';
    state[mode].shuffled = shuffle(mode === 'jianDa' ? JIANDA_ESSAYS : LUNSHU_ESSAYS);
    state[mode].currentIndex = 0;
    saveState();
    render();
  });

  updateMobileActionBar(mode, modeState, questions);
}

function bindExamEvents() {
  const questions = state.exam.questions || [];
  const modeState = state.exam;
  const idx = clampIndex(modeState.currentIndex || 0, questions.length);
  const currentQ = questions[idx];
  if (!currentQ) return;

  if (!currentQ._isEssay) {
    bindChoiceEvents('exam', modeState, questions);
  } else {
    // Essay question in exam mode - simple next/prev
    document.getElementById('btnPrev')?.addEventListener('click', () => navigate('exam', modeState, questions, -1));
    document.getElementById('btnNext')?.addEventListener('click', () => navigate('exam', modeState, questions, 1));
    updateMobileActionBar('exam', modeState, questions);

    if (!window.IS_MOBILE) {
      if (window._kbCleanup) window._kbCleanup();
      const handler = function(e) {
        if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
        if (e.key === 'ArrowRight') {
          e.preventDefault();
          navigate('exam', modeState, questions, 1);
        }
        if (e.key === 'ArrowLeft') {
          e.preventDefault();
          navigate('exam', modeState, questions, -1);
        }
      };
      document.addEventListener('keydown', handler);
      window._kbCleanup = () => document.removeEventListener('keydown', handler);
    }
  }

  document.getElementById('btnRegenExam')?.addEventListener('click', () => {
    if (!confirm('重新生成试卷？当前答题记录将丢失。')) return;
    state.exam.questions = genExamQuestions();
    state.exam.answers = {};
    state.exam.revealed = {};
    state.exam.currentIndex = 0;
    state.exam.visited = {};
    state.exam.cardOpen = true;
    saveState();
    render();
  });
  document.getElementById('btnResetExam')?.addEventListener('click', () => {
    if (!confirm('重置考试答案记录？')) return;
    state.exam.answers = {};
    state.exam.revealed = {};
    state.exam.currentIndex = 0;
    state.exam.visited = {};
    saveState();
    render();
  });
  document.getElementById('btnGenExam')?.addEventListener('click', () => {
    state.exam.questions = genExamQuestions();
    state.exam.answers = {};
    state.exam.revealed = {};
    state.exam.currentIndex = 0;
    state.exam.visited = {};
    state.exam.cardOpen = true;
    saveState();
    render();
  });

  document.querySelectorAll('[data-jump]').forEach(btn => {
    btn.addEventListener('click', () => {
      const target = parseInt(btn.dataset.jump, 10);
      if (!Number.isNaN(target)) {
        modeState.currentIndex = target;
        if (modeState.visited && questions[target]) {
          modeState.visited[questions[target].id || questions[target].key] = true;
        }
        saveState();
        render();
      }
    });
  });

  updateMobileActionBar('exam', modeState, questions);

  if (!window.IS_MOBILE && !currentQ._isEssay) {
    if (window._kbCleanup) window._kbCleanup();
    const answered = isAnswered(modeState, currentQ) || isRevealed(modeState, currentQ);
    const handler = function(e) {
      if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
      if (!answered) {
        const num = parseInt(e.key, 10);
        if (num >= 1 && num <= currentQ.options.length) {
          const opt = currentQ.options[num - 1];
          const btn = document.querySelector('.option-btn[data-letter="' + opt.letter + '"]');
          if (btn) btn.click();
        }
      }
      if (e.key === 'Enter' && !answered) {
        e.preventDefault();
        doSubmit('exam', modeState, questions);
      }
      if (e.key === 'ArrowRight') {
        e.preventDefault();
        navigate('exam', modeState, questions, 1);
      }
      if (e.key === 'ArrowLeft') {
        e.preventDefault();
        navigate('exam', modeState, questions, -1);
      }
    };
    document.addEventListener('keydown', handler);
    window._kbCleanup = () => document.removeEventListener('keydown', handler);
  }
}

let state = loadState();

document.querySelectorAll('.nav-tab, .mobile-nav-tab').forEach(btn => {
  btn.addEventListener('click', () => {
    state.currentMode = btn.dataset.mode;
    saveState();
    render();
  });
});

// Mark first essay as visited on load
if (state.jianDa.visited && Object.keys(state.jianDa.visited).length === 0 && JIANDA_ESSAYS.length > 0) {
  state.jianDa.visited[JIANDA_ESSAYS[0].id] = true;
}
if (state.lunShu.visited && Object.keys(state.lunShu.visited).length === 0 && LUNSHU_ESSAYS.length > 0) {
  state.lunShu.visited[LUNSHU_ESSAYS[0].id] = true;
}

render();
</script>

</body>
</html>
